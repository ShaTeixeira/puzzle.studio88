<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
</head>
<body>

<h1>Painel Administrativo</h1>
<p>Acesso exclusivo</p>

<button onclick="logout()">Sair</button>

<script>
if (localStorage.getItem("auth") !== "true") {
  window.location.href = "admin.html";
}

function logout() {
  localStorage.removeItem("auth");
  window.location.href = "admin.html";
}
</script>

</body>
</html>
