<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puzzle Studio | Notícias</title>
    <link
      rel="icon"
      href="./assets/imgs/logo.png"
      type="image/png"
      sizes="16x16"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-violet-200">
    <header class="bg-[#191923] shadow-md py-5">
      <div class="container mx-auto flex justify-between items-center px-6">
        <h1 class="text-2xl font-bold text-white">Puzzle Studio</h1>
        <nav>
          <a href="index.html" class="text-white px-4">Home</a>
          <a href="noticias.html" class="text-white px-4">Notícias</a>
          <a href="#planos" class="bg-violet-200 text-black px-4 py-2 rounded-lg text-sm md:text-base whitespace-nowrap font-semibold">Ver Planos</a>
        </nav>
      </div>
    </header>

    <section class="container mx-auto py-16 px-6">
      <h2 class="text-3xl font-bold text-center mb-8">Últimas Notícias</h2>
      <div
        id="news-container"
        class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
    </section>

    <footer class="bg-dark-bg py-6 text-center text-black">
      <p>&copy; 2025 @puzzle.studio88 - Todos os direitos reservados.</p>
    </footer>

    <script>
      const noticias = [
        {
          imagem: "./assets/news/news11.jpg",
          titulo: "Amazon teria apresentado proposta para aquisição do TikTok",
          descricao:
            "segundo fontes próximas ao assunto, a oferta foi enviada à Casa Branca, mas não estaria sendo tratada com seriedade. Ainda assim, acredita-se que o interesse da empresa pode pressionar concorrentes a apresentarem propostas mais altas [...]",
          link: "./news1_03_04_2025.html",
        },
        {
          imagem: "./assets/news/news12.jpg",
          titulo: "Bill Gates publica primeiro código-fonte da Microsoft",
          descricao:
            "Em seu blog, ele conta que sua inspiração veio de uma revista de tecnologia que trazia na capa o Altair 8800 da MITS, um dos primeiros computadores pessoais. Gates e Paul Allen passaram dois meses programando uma versão da linguagem BASIC compatível com o chip do Altair [...]",
          link: "./news2_03_04_2025.html",
        },
        {
          imagem: "./assets/news/news13.jpg",
          titulo: "Anthropic lança plano de uso educacional para ensino superior",
          descricao:
            "o Claude for Education é voltado para estudantes, professores e funcionários. Ele inclui o Learning Mode, que incentiva alunos a desenvolverem o pensamento crítico, fazendo perguntas complementares em vez de fornecer apenas respostas diretas [...]",
          link: "./news3_03_04_2025.html",
        },
      ];

      function carregarNoticias() {
        const container = document.getElementById("news-container");
        container.innerHTML = "";
        noticias.forEach((noticia) => {
          container.innerHTML += `
          <article class="bg-white p-6 rounded-lg shadow-lg">
            <img src="${noticia.imagem}" alt="${noticia.titulo}" class="w-full h-40 object-cover rounded-md mb-4" />
            <h3 class="text-xl font-bold mb-3">${noticia.titulo}</h3>
            <p class="text-gray-600">${noticia.descricao}</p>
            <a href="${noticia.link}" class="text-violet-400 font-bold mt-4 inline-block">Leia mais</a>
          </article>
        `;
        });
      }

      document.addEventListener("DOMContentLoaded", carregarNoticias);
    </script>
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
    <script src="./js/script.js"></script>
  </body>
</html>
