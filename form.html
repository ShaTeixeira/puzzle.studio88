<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solicite orçamento - Puzzle Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-violet-200 flex justify-center items-center min-h-screen">
    <div id="formContainer" class="bg-white shadow-lg rounded-lg p-6 w-full max-w-md mx-4">
      <h2 class="text-2xl font-bold text-center text-primary mb-6">Envie uma mensagem para nossa equipe</h2>
      <form id="contactForm" class="space-y-6">
        <div>
          <label for="name" class="block text-gray-700">Nome:</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Digite o seu nome completo"
            required
            class="w-full px-4 py-2 border rounded-md shadow-sm focus:ring-2 focus:ring-primary focus:outline-none"
          />
        </div>

        <div>
          <label for="email" class="block text-gray-700">E-mail:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="nome@email.com"
            required
            class="w-full px-4 py-2 border rounded-md shadow-sm focus:ring-2 focus:ring-primary focus:outline-none"
          />
        </div>

        <div>
          <label for="plano" class="block text-gray-700">Selecione o plano:</label>
          <select id="plano" name="plano" class="w-full px-4 py-2 border rounded-md shadow-sm focus:ring-2 focus:ring-primary focus:outline-none">
            <option value="basico">Básico</option>
            <option value="profissional">Profissional</option>
            <option value="personalizado">Personalizado</option>
          </select>
        </div>

        <div>
          <label for="message" class="block text-gray-700">Mensagem:</label>
          <textarea
            id="message"
            name="message"
            placeholder="Escreva tudo que está precisando"
            required
            class="w-full px-4 py-2 border rounded-md shadow-sm focus:ring-2 focus:ring-primary focus:outline-none resize-none"
            rows="5"
          ></textarea>
          <span class="text-xs">Tempo de resposta 48h. Para uma resposta mais rápida, entre em contato pelo <a class="text-primary" href="https://wa.me/5527996189892?text=Gostaria%20de%20saber%20sobre%20landing%20page.%20Aguardo%20retorno.">WhatsApp</a></span>
        </div>

        <button type="submit" class="w-full bg-primary text-white py-2 rounded-md text-md font-semibold hover:bg-primary-dark transition-all">
          Enviar
        </button>
      </form>
    </div>

    <!-- Tela de Agradecimento (inicialmente oculta) -->
    <div id="thankYouContainer" class="hidden bg-white shadow-lg rounded-lg p-6 w-full max-w-md mx-4 text-center">
      <img src="https://cdn-icons-png.flaticon.com/512/190/190411.png" alt="Check" class="w-20 mx-auto mb-4">
      <h2 class="text-2xl font-semibold text-gray-800">Mensagem Enviada!</h2>
      <p class="text-gray-600 mt-2">Obrigado pelo seu contato! Em breve nossa equipe responderá.</p>
      <a href="index.html" class="block mt-4 bg-primary hover:bg-primary-dark text-white py-2 px-4 rounded-lg">
        Voltar para a Página Inicial
      </a>
    </div>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#7a7afc",
              "primary-dark": "#5c5cd8",
            },
          },
        },
      };

      // Captura o parâmetro da URL e seleciona automaticamente o plano
      function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
      }

      document.addEventListener("DOMContentLoaded", function () {
        const planoSelecionado = getQueryParam("plano");
        const selectElement = document.getElementById("plano");

        if (planoSelecionado && selectElement) {
          selectElement.value = planoSelecionado;
        }

        // Manipulação do envio do formulário
        const form = document.getElementById("contactForm");
        const formContainer = document.getElementById("formContainer");
        const thankYouContainer = document.getElementById("thankYouContainer");

        form.addEventListener("submit", function (event) {
          event.preventDefault(); // Impede o recarregamento da página

          // Esconde o formulário e exibe a tela de agradecimento
          formContainer.classList.add("hidden");
          thankYouContainer.classList.remove("hidden");
        });
      });
    </script>
  </body>
</html>
